<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GlowTrack | Tambah Rutinitas</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>GlowTrack</h1>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>

        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="daftar.html">Daftar Rutinitas</a></li>
                <li><a href="tambah.html">Tambah Rutinitas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Rutinitas</h2>
            <p class="subtitle">
                Tambahkan produk skincare baru ke dalam rutinitasmu.
            </p>

            <form>
                <p>
                    <label for="produk">Nama Produk</label>
                    <input type="text" id="produk" name="produk" required>
                </p>

                <p>
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori">
                        <option value="pembersih">Pembersih</option>
                        <option value="toner">Toner</option>
                        <option value="serum">Serum</option>
                        <option value="pelembap">Pelembap</option>
                        <option value="sunscreen">Sunscreen</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </p>

                <p>
                    <label for="waktu">Waktu Pemakaian</label>
                    <select id="waktu" name="waktu">
                        <option value="pagi">Pagi</option>
                        <option value="malam">Malam</option>
                        <option value="pagi-malam">Pagi &amp; Malam</option>
                    </select>
                </p>

                <p>
                    <label for="urutan">Urutan Pemakaian</label>
                    <input type="number" id="urutan" name="urutan" min="1" required>
                </p>

                <p>
                    <label for="catatan">Catatan</label>
                    <textarea
                        id="catatan"
                        name="catatan"
                        rows="3"
                        placeholder="Contoh: tunggu 2 menit sebelum lanjut ke langkah berikutnya">
                    </textarea>
                </p>

                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GlowTrack - Skincare Routine</p>
    </footer>

</body>
</html>
